[package]
name = "photo-analyzer"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "photo-analyzer"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
walkdir = "2"
image = "0.25"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
candle-core = "0.9"
candle-nn = "0.9"
candle-transformers = "0.9"
ort = { version = "2.0.0-rc.10", default-features = false, features = ["std", "ndarray", "load-dynamic", "api-24"] }
hf-hub = "0.3"
rayon = "1"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokenizers = "0.20"
ndarray = "0.17"
ureq = "2"
